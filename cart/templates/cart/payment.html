{% extends 'base.html' %}
{% load static %}
{% block content %}

    <div style="text-align: center; margin-top: 10%;">
        <h3>Complete Your Payment</h3>
        <p>Amount: ₹100.00</p>
        <!-- Custom payment initiator trigger button -->
        <button id="rzp-button1" style="padding: 10px 20px; background-color: #3399cc; color: #fff; border: none; cursor: pointer;">Pay with Razorpay</button>
    </div>

    <!-- Razorpay Standard Checkout Script -->
    <script src="https://razorpay.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            "key": "{{ razorpay_merchant_key }}",
            "amount": "{{ amount }}",
            "currency": "{{ currency }}",
            "name": "Your Company Name",
            "description": "Test Transaction Description",
            "order_id": "{{ razorpay_order_id }}",
            "callback_url": "{{ request.scheme }}://{{ request.get_host }}{% url 'place_order' %}", // Endpoint to process verification
            "prefill": {
                "name": "John Doe",
                "email": "johndoe@example.com",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#3399cc"
            },
            "redirect": true
        };

        var rzp1 = new Razorpay(options);

        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
    </script>
{% endblock %}
